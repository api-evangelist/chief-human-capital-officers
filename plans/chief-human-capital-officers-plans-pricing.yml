description: >-
  The Chief Human Capital Officers Council publishes no plans, tiers, or pricing of any
  kind. It is a statutory interagency council of the U.S. federal government (5 U.S.C.
  1401-1402) chaired by the Director of OPM; its output is public policy memoranda,
  annual reports, working-group products and a member roster, distributed free of charge
  as web pages and PDFs at https://www.opm.gov/chcoc. There is no API, no account, no
  signup, and therefore nothing to meter or bill.
