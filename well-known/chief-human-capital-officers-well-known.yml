provider: Chief Human Capital Officers Council
providerId: chief-human-capital-officers
summary: >-
  No /.well-known/ document is served on any host associated with the CHCO Council.
  chcoc.gov and www.chcoc.gov 301 every path to https://www.opm.gov/chcoc. www.opm.gov
  answers 404 for extensionless paths and a 503 HTML "Unexpected Error" CMS page for
  paths carrying a file extension — neither is a document. beta.chcoc.gov is a catch-all
  that answers 200 with the same HTML page shell for every path, including
  /.well-known/agent-card.json, and is therefore recorded as a miss rather than a hit.
  Notably, OPM publishes a real vulnerability disclosure policy as a web page covering
  chcoc.gov and opm.gov, but does NOT serve it as an RFC 9116 /.well-known/security.txt.
notes:
  - >-
    No WellKnown or SecurityTxt pointer is emitted in apis.yml: this file records a
    measured absence, not a served surface.
