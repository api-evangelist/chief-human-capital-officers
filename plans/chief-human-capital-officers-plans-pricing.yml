    SUPERSEDES A SCAFFOLD. Until 2026-09-05 this file carried three invented tiers
    (Free / Professional / Enterprise) with invented quotas, written by the 2026-05-04
    bulk sweep and marked method: generated. None of it was ever published by the CHCO
    Council. It has been replaced with the measured result: zero published plans.
  - >-
    Access is free and unauthenticated. Every resource the Council publishes is reachable
    without a key, an account, or a fee, consistent with federal public-information policy.
